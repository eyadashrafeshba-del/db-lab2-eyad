{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<h1>Register</h1>
<p class="subtitle">Create your account</p>

<ul id="errors">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>

<form id="register-form" method="post" action="/register" novalidate>
    <label>Name
        <input name="name" value="{{ name }}" autocomplete="name" autofocus>
    </label>
    <label>Email
        <input name="email" value="{{ email }}" autocomplete="email">
    </label>
    <label>Password
        <input name="password" type="password" autocomplete="new-password">
    </label>
    <label>Confirm password
        <input name="confirm_password" type="password" autocomplete="new-password">
    </label>
    <button class="btn" type="submit">Register</button>
</form>

<p class="switch">Already registered? <a href="/login">Login</a></p>
{% endblock %}
