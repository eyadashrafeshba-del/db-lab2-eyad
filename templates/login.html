{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>Login</h1>
<p class="subtitle">Alexandria National University</p>

<ul id="errors">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>

<form id="login-form" method="post" action="/login" novalidate>
    <label>Email
        <input name="email" value="{{ email }}" autocomplete="email" autofocus>
    </label>
    <label>Password
        <input name="password" type="password" autocomplete="current-password">
    </label>
    <button class="btn" type="submit">Login</button>
</form>

<p class="switch">No account yet? <a href="/register">Register</a></p>
{% endblock %}
